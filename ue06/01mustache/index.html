<!-- 04 Verschiedene Mustache-Tags in Aktion -->
<script>
    const data = {
        name: "Max",
        address: {
            zip: "3353",
        },
        bio: "Ich bin ein <strong>cooler</strong> Typ.",
        isOnline: true,
        hobbies: ["Fußball", "Lesen"],
        jobs: [],
    };
    fetch("card.mustache")
        .then(r => r.text())
        .then(t => {
            const result = Mustache.render(t, data);
            document.getElementById("app").innerHTML = result;
        });
</script>
